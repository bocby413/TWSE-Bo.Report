<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#14383d"/><stop offset="1" stop-color="#0a1416"/></linearGradient>
    <linearGradient id="disc" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1d5158"/><stop offset="1" stop-color="#0f2a2e"/></linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <!-- 中間的圓：像存錢Bo士的金幣那個位置 -->
  <circle cx="32" cy="27" r="18" fill="url(#disc)" stroke="#2dd4bf" stroke-width="2"/>
  <circle cx="32" cy="27" r="14.5" fill="none" stroke="#2dd4bf" stroke-width="1" opacity=".35"/>
  <!-- 往上走的三根 K 棒：綠、紅、紅 -->
  <line x1="24" y1="26" x2="24" y2="37" stroke="#34d399" stroke-width="1.6"/>
  <rect x="21.8" y="28.5" width="4.4" height="6" rx="1" fill="#34d399"/>
  <line x1="32" y1="19" x2="32" y2="32" stroke="#ff5a68" stroke-width="1.6"/>
  <rect x="29.8" y="21.5" width="4.4" height="8" rx="1" fill="#ff5a68"/>
  <line x1="40" y1="13" x2="40" y2="26" stroke="#ff5a68" stroke-width="1.6"/>
  <rect x="37.8" y="15" width="4.4" height="8.5" rx="1" fill="#ff5a68"/>
  <!-- 下面三顆小藥丸 -->
  <rect x="12" y="50" width="12" height="6" rx="3" fill="#ff5a68"/>
  <rect x="26" y="50" width="12" height="6" rx="3" fill="#ff5a68"/>
  <rect x="40.7" y="50.7" width="10.6" height="4.6" rx="2.3" fill="none" stroke="#2dd4bf" stroke-width="1.4"/>
</svg>
