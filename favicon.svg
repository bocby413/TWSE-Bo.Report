  <path d="M 21.2 16.9 A 20 20 0 0 1 42.8 16.9" fill="none" stroke="#f5c542" stroke-width="6"/>
  <path d="M 44.5 18.4 A 20 20 0 0 1 52 34" fill="none" stroke="#ff5a68" stroke-width="6"/>
  <!-- 指針指向偏多 -->
  <line x1="32" y1="34" x2="44.5" y2="22.5" stroke="#e6f1f0" stroke-width="3" stroke-linecap="round"/>
  <circle cx="32" cy="34" r="3.6" fill="#e6f1f0"/>
  <circle cx="32" cy="34" r="1.6" fill="#0a1416"/>
  <!-- 下面三根往上走的 K 棒 -->
  <line x1="22" y1="44" x2="22" y2="57" stroke="#34d399" stroke-width="1.6"/>
  <rect x="19.6" y="47.5" width="4.8" height="6.5" rx="1" fill="#34d399"/>
  <line x1="32" y1="42.5" x2="32" y2="55.5" stroke="#ff5a68" stroke-width="1.6"/>
  <rect x="29.6" y="45" width="4.8" height="7.5" rx="1" fill="#ff5a68"/>
  <line x1="42" y1="41" x2="42" y2="54" stroke="#ff5a68" stroke-width="1.6"/>
  <rect x="39.6" y="43" width="4.8" height="8" rx="1" fill="#ff5a68"/>
</svg>
