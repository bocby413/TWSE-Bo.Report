name: 收盤價歷史

# 給 index.html（股市情勢）用的。每個交易日盤後把全市場的行情、三大法人、融資融券、
# 基本面與新聞累積進 history.json、d/、news.json；第一次會往回補，一次跑不完會分幾次。
on:
  schedule:
    - cron: '5 7 * * 1-5'     # UTC 07:05 = 台北 15:05，證交所盤後資料出來之後
    - cron: '40 9 * * 1-5'    # 台北 17:40 再補一次，防上櫃資料更新較慢
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: history
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 抓歷史收盤價
        run: python scripts/fetch_history.py
      - name: 有變動才提交
        run: |
          git config user.name "history-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add history.json news.json d
          if git diff --staged --quiet; then
            echo "歷史資料沒有變動"
          else
            git commit -m "收盤價歷史 $(TZ=Asia/Taipei date +%F)"
            # 先拉再推，最多試三次
            for i in 1 2 3; do
              git pull --rebase origin "${GITHUB_REF_NAME}" && git push && break
              sleep 10
            done
          fi
