name: 收盤價歷史

# 給 index.html（台股Bo報）用的。每個交易日盤後把全市場的行情、三大法人、融資融券、
# 基本面與新聞累積進 history.json、d/、news.json；第一次會往回補五年，要好幾個小時，
# 一次跑不完會分幾次接著補。
on:
  schedule:
    - cron: '5 7 * * 1-5'     # UTC 07:05 = 台北 15:05，證交所盤後資料出來之後
    - cron: '40 9 * * 1-5'    # 台北 17:40 再補一次，防上櫃資料更新較慢
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: history
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 同步到最新的 main
        # 排在佇列裡的 run 會用「按下去那一刻」的版本，前一次的資料已經推上去了它不知道，
        # 接著會從舊資料開始補、最後提交又撞車。先拉到最新再跑
        run: |
          git fetch origin "${GITHUB_REF_NAME}"
          git reset --hard "origin/${GITHUB_REF_NAME}"
      - name: 抓歷史收盤價
        run: python scripts/fetch_history.py
      - name: 有變動才提交
        run: |
          git config user.name "history-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add history.json meta.json news.json d
          if git diff --staged --quiet; then
            echo "歷史資料沒有變動"
            exit 0
          fi
          git commit -m "收盤價歷史 $(TZ=Asia/Taipei date +%F)"
          # 先拉再推，最多試三次。資料檔每次都是整份重寫，撞到就以這次的為準
          # （rebase 裡 theirs 指的是正在重放的、也就是這次的 commit）
          for i in 1 2 3; do
            if git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep 10
          done
          echo "::error::推不上去，這次抓的資料沒有存進 repo"
          exit 1
