name: 收盤價歷史

# 給 index.html（台股Bo報）用的。每個交易日盤後把全市場的行情、三大法人、融資融券、
# 基本面與新聞累積進 history.json、d/、news.json；第一次會往回補五年，要好幾個小時，
# 一次跑不完會分幾次接著補。
on:
  schedule:
    # UTC 09:45 = 台北 17:45，行情（14:30）、法人（16:00）、融資券（17:30）都出來了才跑。
    # GitHub 的排程很不準（9/21、9/22 都遲到好幾個小時甚至沒跑），所以 17:45 到 23:45 每小時排一次當保險；
    # 只要前面某一次已經把今天更新好，後面的會在第一步就跳過，只花幾十秒
    - cron: '45 9-15 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: history
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q numpy
      - name: 同步到最新的 main
        # 排在佇列裡的 run 會用「按下去那一刻」的版本，前一次的資料已經推上去了它不知道，
        # 接著會從舊資料開始補、最後提交又撞車。先拉到最新再跑
        run: |
          git fetch origin "${GITHUB_REF_NAME}"
          git reset --hard "origin/${GITHUB_REF_NAME}"
      - name: 今天已經更新過就跳過
        id: chk
        # 只有排程的 run 會跳過；手動按 Run workflow 一律照跑
        # 要更新的是「今天」的盤後資料；排程被 GitHub 拖過台北午夜才跑的話，要更新的還是前一天
        run: |
          if [ "$(TZ=Asia/Taipei date +%H)" -ge 14 ]; then
            want=$(TZ=Asia/Taipei date +%F)
          else
            want=$(TZ=Asia/Taipei date -d yesterday +%F)
          fi
          last=$(python -c "import json;print(json.load(open('ver.json'))['last'])" 2>/dev/null || echo none)
          echo "要更新的交易日 $want、資料最後交易日 $last"
          if [ "${GITHUB_EVENT_NAME}" = "schedule" ] && [ "$last" = "$want" ]; then
            echo "這天的資料已經更新過了，這次跳過"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: 抓歷史收盤價
        if: steps.chk.outputs.skip != 'true'
        run: python scripts/fetch_history.py
      - name: 有變動才提交
        if: steps.chk.outputs.skip != 'true'
        run: |
          git config user.name "history-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add history.json meta.json idx.json ver.json news.json d
          if git diff --staged --quiet; then
            echo "歷史資料沒有變動"
            exit 0
          fi
          git commit -m "收盤價歷史 $(TZ=Asia/Taipei date +%F)"
          # 先拉再推，最多試三次。資料檔每次都是整份重寫，撞到就以這次的為準
          # （rebase 裡 theirs 指的是正在重放的、也就是這次的 commit）
          for i in 1 2 3; do
            if git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep 10
          done
          echo "::error::推不上去，這次抓的資料沒有存進 repo"
          exit 1
